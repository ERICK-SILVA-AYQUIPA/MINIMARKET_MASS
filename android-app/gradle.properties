org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Direccion del backend para el APK de lanzamiento (release). Debe ser HTTPS.
# Se puede cambiar al compilar:  ./gradlew assembleRelease -PmassApiUrl=https://mi-dominio.pe/
massApiUrl=https://mass.ejemplo.pe/
# Direccion para el APK de depuracion (debug). 10.0.2.2 es "localhost de la PC" visto desde el emulador.
# En un celular fisico usa la IP de la PC en el Wi-Fi:  -PmassApiUrlDebug=http://192.168.1.50:8000/
massApiUrlDebug=http://10.0.2.2:8000/
