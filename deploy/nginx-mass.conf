# Nginx + PHP-FPM 8.3 para Minimarket Mass con HTTPS (Let's Encrypt).
# 1. Cambiar mass.ejemplo.pe por el dominio real y /var/www/minimarket_mass por la carpeta del proyecto.
# 2. sudo cp deploy/nginx-mass.conf /etc/nginx/sites-available/mass && sudo ln -s /etc/nginx/sites-available/mass /etc/nginx/sites-enabled/
# 3. sudo certbot --nginx -d mass.ejemplo.pe && sudo nginx -t && sudo systemctl reload nginx
# Ver docs/despliegue.md, seccion 5.

# Todo lo que llega por http:// se manda a https://
server {
    listen 80;
    server_name mass.ejemplo.pe;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name mass.ejemplo.pe;

    # La raiz es public/: nadie puede descargar .env, config/, database/ ni respaldos/
    root /var/www/minimarket_mass/public;
    index index.php;

    # Los crea certbot; se renuevan solos
    ssl_certificate     /etc/letsencrypt/live/mass.ejemplo.pe/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mass.ejemplo.pe/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # El CSV del catalogo pesa hasta 1 MB; se deja un margen
    client_max_body_size 2m;

    location / {
        try_files $uri /index.php?$query_string;
    }

    # API de la app Android: /api/v1/... la atiende public/api/index.php
    location /api/ {
        try_files $uri /api/index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    # Archivos ocultos (.git, .env si alguien los copia a public/ por error)
    location ~ /\. {
        deny all;
    }
}
