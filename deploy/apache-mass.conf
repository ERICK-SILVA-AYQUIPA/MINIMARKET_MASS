# Apache 2.4 para Minimarket Mass con HTTPS (Let's Encrypt).
# 1. Cambiar mass.ejemplo.pe por el dominio real y /var/www/minimarket_mass por la carpeta del proyecto.
# 2. sudo cp deploy/apache-mass.conf /etc/apache2/sites-available/mass.conf
# 3. sudo a2enmod ssl headers rewrite && sudo a2ensite mass && sudo certbot --apache -d mass.ejemplo.pe
# Ver docs/despliegue.md, seccion 5.

# Todo lo que llega por http:// se manda a https://
<VirtualHost *:80>
    ServerName mass.ejemplo.pe
    RewriteEngine On
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName mass.ejemplo.pe
    # La raiz es frontend/public/: nadie puede descargar .env, backend/ ni respaldos/
    DocumentRoot /var/www/minimarket_mass/frontend/public
    <Directory /var/www/minimarket_mass/frontend/public>
        AllowOverride None
        Options -Indexes
        Require all granted
    </Directory>
    # API de la app Android: /api/v1/... la atiende frontend/public/api/index.php, con la cabecera Authorization
    <Directory /var/www/minimarket_mass/frontend/public/api>
        FallbackResource /api/index.php
        CGIPassAuth On
    </Directory>

    SSLEngine on
    # Los crea certbot; se renuevan solos
    SSLCertificateFile    /etc/letsencrypt/live/mass.ejemplo.pe/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/mass.ejemplo.pe/privkey.pem
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1

    # El CSV del catalogo pesa hasta 1 MB; se deja un margen
    LimitRequestBody 2097152

    ErrorLog  ${APACHE_LOG_DIR}/mass_error.log
    CustomLog ${APACHE_LOG_DIR}/mass_acceso.log combined
</VirtualHost>
