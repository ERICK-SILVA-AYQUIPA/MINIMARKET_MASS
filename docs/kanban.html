{id:4,col:3,own:'Keymer Machaca Puma',a:0,t:'Migraciones de la aplicación',x:'Agregan 8 tablas: login, auditoría, devoluciones, retiros de caja…',e:'El esquema base se amplió con scripts aparte: clave de acceso, intentos de ingreso, ajuste por conteo, auditoría, ingreso de mercadería y operaciones de caja. Se ejecutan en un orden fijo.',p:'Después de correr todos, la base tiene 34 tablas en total.',c:'34 tablas = 26 base + 8 migraciones',f:['login.sql','seguridad.sql','ajustes.sql','auditoria.sql','ingresos.sql','operaciones.sql'],v:'Conteo de tablas verificado'},
{id:5,col:3,own:'Keymer Machaca Puma',a:0,t:'Catálogo inicial de 94 productos',x:'Productos reales de ejemplo, también en CSV.',e:'Trae marcas conocidas (Laive, Coca-Cola, San Fernando, Bimbo…) con precios de referencia y su primer ingreso en las 3 tiendas. El CSV sirve para practicar la pantalla de importar.',p:'Abre el catálogo: debe mostrar los 94 productos.',c:'Catálogo cargado en las 3 tiendas',f:['database/catalogo.sql','database/catalogo_inicial.csv'],v:'Leído'},
{id:6,col:3,own:'Erick Silva Ayquipa',a:1,t:'Una clase por tabla',x:'Producto, Venta, Stock, Tienda, Caja, Cliente…',e:'Una clase es un molde. Cada tabla tiene su molde, que repite los CHECK de la tabla: un dato mal formado se rechaza en PHP antes de llegar a MySQL.',p:'Abre public/poo_producto.php y revisa los resultados.',c:'Cada clase valida sus propios datos',f:['models/Producto.php','models/Venta.php','models/Stock.php'],v:'Pasa las pruebas unitarias'},
{id:7,col:3,own:'Erick Silva Ayquipa',a:1,t:'Roles con herencia',x:'Usuario → Administrador, Cajero y Almacenero.',e:'La clase madre Usuario no tiene permisos. Cada rol hijo activa los suyos: el cajero vende, el administrador anula y ve reportes, el almacenero recibe y traslada mercadería. Un empleado inactivo no puede nada.',p:'Abre public/poo_roles.php y mira qué puede hacer cada rol.',c:'El cajero no anula; solo el administrador de la tienda anula',f:['models/Usuario.php','Administrador.php','Cajero.php','Almacenero.php'],v:'Pasa las pruebas unitarias'},
{id:8,col:3,own:'Erick Silva Ayquipa',a:1,t:'Pagos con herencia',x:'Efectivo, tarjeta y billetera Sip.',e:'PagoVenta es la base y cada método agrega lo suyo: el efectivo guarda el vuelto, la tarjeta los últimos 4 dígitos, la billetera Sip su código de operación. Una venta puede pagarse con varios métodos y deben sumar el total.',p:'Abre la factura F001-1: tiene pago mixto.',c:'Los pagos válidos suman el total',f:['models/pagos/PagoVenta.php','PagoEfectivo.php','PagoTarjeta.php','PagoSip.php'],v:'Pasa las pruebas unitarias'},
{id:9,col:3,own:'Erick Silva Ayquipa',a:1,t:'Repositorios',x:'Las clases que leen de MySQL con PDO.',e:'El resto del sistema pide «dame las ventas de hoy» y el repositorio sabe cómo traerlas. Es el único lugar con consultas de lectura, todas preparadas.',p:'Cualquier pantalla de lista usa uno; revisa que cargue.',c:'Ningún controlador ni vista tiene SQL',f:['models/ProductoRepository.php','VentaRepository.php','…'],v:'Revisión de seguridad: 156 consultas sin datos pegados'},
{id:10,col:3,own:'Gerald Condori Quispe',a:1,t:'Servicios con transacciones',x:'Escriben en la base: o se guarda todo o nada.',e:'Una venta toca venta, detalle, pagos, stock, kardex y correlativo. Si un paso falla, se deshace todo. Además bloquean filas en orden fijo para que dos cajeros vendiendo a la vez no se traben.',p:'Vende un producto sin stock: debe rechazarse sin dejar nada a medias.',c:'Venta, anulación y devolución son una sola transacción',f:['models/servicios/VentaServicio.php','InventarioServicio.php','CajaServicio.php'],v:'Código leído (VentaServicio y Servicio)'},
{id:11,col:3,own:'Erick Silva Ayquipa',a:1,t:'Dinero y cantidades exactas',x:'Todo en céntimos y milésimas enteros.',e:'Los decimales en computadora fallan. Dinero y Cantidad trabajan con enteros y recién al final los muestran como S/ 24.90 o 1.250 kg. El importe es cantidad × precio redondeado a 2 decimales.',p:'Vende 1.250 kg de un producto al peso y revisa el importe.',c:'Importe = ROUND(cantidad × precio, 2)',f:['models/Dinero.php','models/Cantidad.php'],v:'Pasa las pruebas unitarias'},
{id:12,col:3,own:'Erick Silva Ayquipa',a:2,t:'Punto de entrada y rutas',x:'Un solo archivo recibe toda visita.',e:'index.php es la única puerta: lee ?ruta=, comprueba quién entró, valida el token de seguridad y llama al controlador. Hay 29 rutas que cambian datos, todas por POST. Un error inesperado muestra una página limpia.',p:'Escribe ?ruta=xx en la dirección: debe salir «La ruta pedida no existe».',c:'Solo POST cambia datos; 404 si la ruta no existe',f:['public/index.php'],v:'Leído completo'},
{id:13,col:3,own:'Gerald Condori Quispe',a:2,t:'Login y claves',x:'Entrar con DNI, salir y cambiar la clave.',e:'El empleado entra con su DNI. El mensaje de error es el mismo si el DNI no existe o la clave es mala, para no revelar quién trabaja ahí. Al entrar se cambia el id de sesión.',p:'Entra con una clave mala: debe decir «DNI o clave incorrectos».',c:'Cinco claves erradas bloquean 15 minutos',f:['controllers/AuthController.php','models/IntentoLoginRepository.php'],v:'Leído completo'},
{id:14,col:3,own:'Keymer Machaca Puma',a:2,t:'Ventas y caja',x:'Abrir turno, vender, anular y devolver.',e:'El cajero solo vende con su turno abierto. Solo el administrador de esa tienda anula, y pide un motivo. Las devoluciones se aceptan hasta 7 días y el efectivo sale de la gaveta del turno.',p:'Anula una venta como cajero: debe dar error 403.',c:'La anulación devuelve el stock al kardex',f:['controllers/VentaController.php','CajaController.php'],v:'Servicio leído; pruebas web no ejecutadas'},
{id:15,col:3,own:'Gerald Condori Quispe',a:2,t:'Inventario',x:'Ingresos, traslados, mermas, conteo y kardex.',e:'Cada entrada o salida de mercadería deja una fila en el kardex con quién la hizo y por qué. El almacenero recibe con su guía o factura, traslada entre tiendas, registra mermas y cuenta el stock.',p:'Registra una merma y mírala en ?ruta=kardex.',c:'Todo movimiento de stock queda en el kardex',f:['controllers/InventarioController.php','models/servicios/InventarioServicio.php'],v:'Leído'},
{id:16,col:3,own:'Keymer Machaca Puma',a:2,t:'Productos, personal y clientes',x:'Catálogo, empleados y búsqueda de clientes.',e:'El administrador crea o edita productos, sube su foto, fija el stock mínimo, importa un CSV y maneja su personal. Cajero y administrador buscan clientes por DNI o RUC.',p:'Edita el precio de un producto y revisa la auditoría.',c:'Cada cambio sensible queda en la auditoría',f:['ProductoController.php','EmpleadoController.php','ClienteController.php'],v:'Leído'},
{id:17,col:3,own:'Suhaily Huaypar Quijhua',a:2,t:'Panel, reportes y auditoría',x:'Resumen del día, reportes con CSV y bitácora.',e:'El panel muestra lo vendido hoy contra ayer, el ticket promedio, productos por reponer y cajas abiertas. Los reportes se descargan en CSV y la bitácora dice quién anuló o cambió precios.',p:'Entra como administrador a ?ruta=inicio y a ?ruta=auditoria.',c:'El administrador solo ve su tienda',f:['PanelController.php','ReporteController.php','AuditoriaController.php'],v:'Leído'},
{id:18,col:1,own:'Suhaily Huaypar Quijhua',a:3,t:'Pantallas por rol',x:'Ventas, caja, productos, inventario, tiendas y clientes.',e:'Las vistas solo muestran lo que el controlador les pasa. No tienen SQL ni reglas, y cada texto pasa por escapado para que nadie meta código dañino.',p:'Busca <b> en el buscador: debe verse como texto, no en negrita.',c:'Las 858 salidas <?= están escapadas',f:['views/ventas','views/caja','views/productos','views/inventario'],v:'Revisión de seguridad pasa (19/19)'},
{id:19,col:1,own:'Suhaily Huaypar Quijhua',a:3,t:'Panel de inicio y ticket',x:'Gráfico de 14 días y comprobante de 80 mm.',e:'El panel es la página de entrada tras el login. El ticket se imprime o guarda como PDF, pero es una representación interna: no vale como comprobante electrónico de SUNAT.',p:'Abre un comprobante y pulsa imprimir.',c:'El ticket usa el mismo número de la serie',f:['views/panel/inicio.php','views/ventas/ticket.php'],v:'Leído'},
{id:20,col:1,own:'Suhaily Huaypar Quijhua',a:3,t:'JavaScript y estilos',x:'Un solo script seguro y la fuente Outfit.',e:'app.js escribe con textContent, nunca con innerHTML ni eval, y el sistema funciona igual sin JavaScript. Las reglas siempre se vuelven a revisar en el servidor.',p:'Desactiva JavaScript: las pantallas deben seguir funcionando.',c:'Ninguna vista carga scripts pegados',f:['public/app.js','public/estilos.css'],v:'Revisión de seguridad pasa'},
{id:21,col:3,own:'Gerald Condori Quispe',a:4,t:'Formularios, SQL y salida',x:'Token CSRF, consultas preparadas y texto escapado.',e:'El token evita que otra página mande formularios con tu sesión. Las consultas preparadas impiden la inyección SQL. Una prueba lee todo el código y falla si alguien rompe una de estas reglas.',p:'Ejecuta php tests/seguridad.php: 19 correctas, 0 fallas.',c:'30 formularios con token, 0 SQL en vistas',f:['config/Sesion.php','tests/seguridad.php'],v:'Ejecutado: 19/19'},
{id:22,col:3,own:'Gerald Condori Quispe',a:4,t:'Sesión y bloqueo de ingreso',x:'Cookie protegida; 5 fallos bloquean 15 minutos.',e:'La cookie no la lee JavaScript, la sesión vence a los 30 minutos sin uso y la clave se guarda con bcrypt. La cabecera CSP solo deja correr el script del propio sitio.',p:'Falla la clave 5 veces: debe pedir esperar 15 minutos.',c:'Bloqueo por DNI y por IP',f:['config/Sesion.php','IntentoLoginRepository.php'],v:'Leído; prueba web no ejecutada'},
{id:23,col:3,own:'Gerald Condori Quispe',a:4,t:'Fotos y CSV seguros',x:'La foto se redibuja; el CSV no ejecuta fórmulas.',e:'Una foto subida nunca se guarda tal cual: GD la vuelve a dibujar como JPEG de 600 px, así un archivo disfrazado se pierde. En los CSV, un texto que empieza con = + - @ lleva un apóstrofo para que Excel no lo ejecute.',p:'Sube un .txt renombrado a .jpg: debe rechazarse.',c:'Máximo 2 MB; solo JPG, PNG, WebP o GIF',f:['models/FotoProducto.php','controllers/Controller.php'],v:'Leído'},
{id:24,col:3,own:'Alexander Moreno Flores',a:5,t:'Pruebas unitarias y de seguridad',x:'87 + 19 comprobaciones sin base de datos.',e:'Son programas que comprueban que el código se comporta como debe, en un segundo y sin MySQL.',p:'Ejecuta php tests/unitarios.php y php tests/seguridad.php.',c:'0 fallas',f:['tests/unitarios.php','tests/seguridad.php'],v:'Ejecutado: 87/87 y 19/19; sintaxis OK'},
{id:25,col:3,own:'Alexander Moreno Flores',a:5,t:'GitHub Actions',x:'Revisa cada push con un MySQL nuevo.',e:'En cada push o Pull Request, GitHub revisa la sintaxis y corre las 4 baterías de pruebas contra un MySQL 8.4.11 recién creado.',p:'Mira la pestaña Actions del repositorio: debe salir en verde.',c:'CI verde',f:['.github/workflows/ci.yml'],v:'Leído'},
{id:26,col:3,own:'Alexander Moreno Flores',a:5,t:'Docker con MySQL 8.4',x:'Levanta la base con todos los scripts en orden.',e:'docker compose up -d crea la base y ejecuta los 10 scripts una sola vez. MySQL solo se abre en 127.0.0.1 y las claves salen de .env, que no se sube a GitHub.',p:'docker compose ps debe decir «healthy».',c:'Base lista en unos 30 segundos',f:['docker-compose.yml','.env.example'],v:'Leído; Docker no disponible en el análisis'},
{id:27,col:3,own:'Alexander Moreno Flores',a:5,t:'Servidor con HTTPS y respaldos',x:'Apache, Nginx, respaldo diario y verificación.',e:'La raíz del sitio es public/, así nadie descarga .env ni database/. Los respaldos se hacen cada día a las 23:00 y se guardan los últimos 30. verificar_instalacion.php revisa todo antes de abrir la tienda.',p:'Ejecuta php scripts/verificar_instalacion.php.',c:'Respaldo diario programado',f:['deploy/','scripts/'],v:'Leído'},
{id:28,col:3,own:'Jhon Apaza Belizario',a:6,t:'Diseño de la base y diagrama ER',x:'Diccionario de datos y reglas de negocio.',e:'703 líneas que explican cada tabla, columna y regla, más el diagrama entidad-relación en imagen.',p:'Abre docs/diseno_bd.md y busca una tabla.',c:'Las 26 tablas documentadas',f:['docs/diseno_bd.md','docs/diagrama-er.png'],v:'Leído en parte'},
{id:29,col:3,own:'Jhon Apaza Belizario',a:6,t:'Manual y guías',x:'Uso por rol, MVC, seguridad y despliegue.',e:'El manual explica cada pantalla para administrador, cajero y almacenero. explicacion_archivos.md sirve para estudiar antes de la entrega.',p:'Sigue el manual como cajero: abrir turno y vender.',c:'Una guía por tema',f:['docs/manual_usuario.md','mvc.md','seguridad.md','despliegue.md'],v:'Leído en parte'},
{id:30,col:3,own:'Jhon Apaza Belizario',a:6,t:'Informe UML (final.docx)',x:'5 diagramas: casos de uso, secuencia, actividades, componentes y despliegue.',e:'Explica qué hace el sistema y quién lo usa. Tiene 5 actores (cliente, colaborador, administrador, sistema de pago y sistema central) y 34 casos de uso.',p:'Abre final.docx y revisa los 5 diagramas.',c:'Los 5 diagramas son coherentes entre sí',f:['final.docx'],v:'Texto leído'},
{id:31,col:2,own:'Alexander Moreno Flores',a:5,t:'Pruebas web e integración',x:'Las 160 y 171 comprobaciones contra MySQL.',e:'Estas pruebas piden las páginas como un navegador y revisan la base real. No se pudieron ejecutar en el análisis porque no había MySQL ni Docker, así que sus resultados no están comprobados.',p:'Con Docker encendido: php tests/web.php y php tests/integracion.php.',c:'0 fallas en ambas',f:['tests/web.php','tests/integracion.php'],v:'No ejecutadas en el análisis',al:true},
{id:33,col:2,own:'Alexander Moreno Flores',a:6,t:'Cifras de pruebas del README',x:'Dice 171 y 160 comprobaciones; se contaron ~81 y ~89 llamadas.',e:'Puede que cada llamada cubra varias comprobaciones, por eso no se da por error. Hay que ejecutar las pruebas y copiar el resultado real.',p:'Compara la última línea de cada prueba con el README.',c:'Las cifras del README coinciden con las pruebas',f:['README.md'],v:'Por confirmar con MySQL',al:true},
{"id":40,"col":0,"a":2,"t":"Reportes · ruta y enlace del catálogo en PDF","x":"Conecta la ruta catalogo_pdf y el enlace del menú, después del PR de Luana.","e":"Luana crea el PDF del catálogo pero no toca el router ni el menú. Jhon agrega la ruta catalogo_pdf y el enlace en el menú del administrador en su propio PR, una vez mezclado el de Luana.","p":"El enlace aparece en el menú del administrador y el PDF abre sin errores.","f":["public/index.php","views/layout_inicio.php"],"r":"feat/ruta-catalogo-pdf","own":"Jhon Apaza Belizario"},
{"id":41,"col":0,"a":3,"t":"Panel (layout) · pie de página","x":"El pie de todas las pantallas muestra usuario, rol y año actual.","e":"El pie muestra el usuario conectado, su rol y el año con date('Y'), siempre escapado con e(). Además Erick agrega las rutas y enlaces de menú que pidan los demás y mezcla los PR en el orden del calendario.","p":"Inicio, Productos, Ventas y Caja muestran el pie con usuario, rol y año. La CI sale en verde.","f":["views/layout_fin.php","public/estilos.css","views/layout_inicio.php"],"r":"feat/panel-pie","own":"Erick Silva Ayquipa"},
{"id":42,"col":0,"a":4,"t":"Login · bloqueo temporizado","x":"Cambia el bloqueo a 3 intentos y 30 segundos.","e":"Hoy el login se bloquea tras 5 claves erradas por 15 minutos. El docente pide 3 intentos y 30 segundos: MAXIMO_POR_DNI pasa a 3, la ventana de MINUTE a SECOND y el mensaje dice cuánto esperar. Se ajustan las pruebas del bloqueo.","p":"Un usuario válido entra. Con 3 claves erradas queda bloqueado y a los 30 segundos puede volver a entrar. La CI sale en verde.","f":["models/IntentoLoginRepository.php","controllers/AuthController.php","tests/integracion.php","tests/web.php","docs/manual_usuario.md","docs/seguridad.md"],"r":"feat/login-bloqueo","own":"Gerald Condori Quispe"},
{"id":43,"col":0,"a":1,"t":"Productos · Crear","x":"Nombre con mínimo 3 caracteres y textos de ayuda en el formulario.","e":"El alta ya valida precio, código de 8 a 14 dígitos y código duplicado. Se agrega: nombre con mínimo 3 caracteres y alguna letra, y textos de ayuda en Nombre y Precio.","p":"Un producto nuevo aparece en el catálogo. Un nombre como «ab» o un código repetido muestra el error sin borrar lo escrito. Recargar después de guardar no lo duplica.","f":["models/servicios/ProductoServicio.php","views/productos/formulario.php","tests/integracion.php"],"r":"feat/producto-crear","own":"Alexander Moreno Flores"},
{"id":44,"col":0,"a":1,"t":"Productos · Editar","x":"Si no se cambió nada, no graba ni audita; si cambió el precio, avisa anterior y nuevo.","e":"Editar ya hace el UPDATE con consulta preparada y audita el cambio de precio. Se agrega: sin cambios no se graba ni se audita y avisa «No cambiaste ningún dato»; si cambia el precio, el aviso dice el precio anterior y el nuevo.","p":"Al cambiar el precio, el catálogo muestra el nuevo valor y Auditoría registra PRECIO_CAMBIADO. Guardar sin cambios no deja registro.","f":["models/servicios/ProductoServicio.php","controllers/ProductoController.php","tests/integracion.php"],"r":"feat/producto-editar","own":"Keymer Machaca Puma"},
{"id":45,"col":0,"a":1,"t":"Productos · Baja lógica","x":"Aviso de producto descontinuado en la ficha, sin auditar dos veces.","e":"La baja lógica es el estado DESCONTINUADO (activo = 0) y ya pide confirmación. Se agrega: si el producto ya está descontinuado, avisar sin auditar dos veces, y en la ficha un aviso visible que explique que ya no se vende.","p":"Un producto descontinuado ya no aparece en Venta nueva, pero sigue en la base y en las ventas pasadas. La confirmación aparece antes de darlo de baja.","f":["models/servicios/ProductoServicio.php","views/productos/ficha.php","tests/integracion.php"],"r":"feat/producto-baja","own":"Jhon Apaza Belizario"},
{"id":46,"col":0,"a":2,"t":"Reporte PDF del catálogo","x":"Único módulo que aún no existe: PDF de productos activos con FPDF.","e":"El PDF lista los productos activos con código, nombre, categoría, stock en la tienda y precio; solo lo ve el administrador. Usa FPDF 1.8.6. La ruta y el enlace de menú los agrega Jhon en su PR después de este.","p":"El PDF abre sin errores, con tildes y ñ bien escritas, y el enlace aparece en el menú del administrador. La CI sale en verde.","f":["lib/fpdf/","controllers/ReporteController.php","models/ReporteRepository.php"],"r":"feat/reporte-pdf","own":"Suhaily Huaypar Quijhua"},
{"id":47,"col":0,"a":0,"t":"Base de datos · índices y script de instalación","x":"5 índices nuevos y instalar_laragon.sql con los 11 scripts.","e":"Agrega 5 índices para que los reportes por fecha, el kardex y la búsqueda del turno abierto no recorran tablas enteras. Los suma a Docker, a la documentación del esquema y a las pruebas, y rehace instalar_laragon.sql con los 11 scripts.","p":"Tras docker compose down -v y up -d, SHOW INDEX FROM venta; muestra ix_venta_fecha y EXPLAIN SELECT * FROM venta WHERE fecha_hora >= '2026-10-01'; usa ese índice.","f":["database/indices.sql","docker-compose.yml","tests/integracion.php","docs/diseno_bd.md","database/instalar_laragon.sql"],"r":"feat/bd-indices","own":"Erick Silva Ayquipa"},
{"id":48,"col":0,"a":2,"t":"Integración · rutas de la segunda ronda","x":"Conecta en el router las 3 pantallas nuevas y sus pruebas web.","e":"Cuando estén mezclados los PR de Gerald, Keymer y Luana (segunda tarjeta), Erick conecta en el router las rutas mermas_csv, clientes_csv y reporte_pdf y agrega sus pruebas web.","p":"Como administrador, Clientes, Mermas y Reportes descargan sin error. Como cajero, /?ruta=clientes_csv da 403.","f":["public/index.php","tests/web.php"],"r":"feat/rutas-ronda2","own":"Erick Silva Ayquipa"},
{"id":49,"col":0,"a":2,"t":"Mermas · descargar en CSV","x":"Botón Descargar CSV: una fila por producto perdido.","e":"La pantalla Mermas tiene un botón Descargar CSV con fecha, motivo, cantidad y quién registró cada merma, una fila por producto. La ruta mermas_csv la conecta Erick.","p":"Se abre Mermas, se toca Descargar CSV y en Excel sale una fila por producto, con las tildes bien.","f":["controllers/InventarioController.php","views/inventario/mermas.php"],"r":"feat/mermas-csv","own":"Gerald Condori Quispe"},
{"id":50,"col":0,"a":2,"t":"Categorías y marcas · cantidad de productos","x":"Junto a cada nombre sale cuántos productos activos tiene.","e":"En Categorías y marcas, junto a cada nombre aparece cuántos productos activos tiene, contados en la base con una sola consulta GROUP BY.","p":"Junto a cada nombre sale un número. Al descontinuar un producto de Abarrotes, el número baja en 1.","f":["models/CatalogoRepository.php","controllers/ProductoController.php","views/productos/catalogo.php","tests/web.php"],"r":"feat/catalogo-conteo","own":"Alexander Moreno Flores"},
{"id":51,"col":0,"a":2,"t":"Clientes · descargar en CSV","x":"Descargar CSV con DNI, RUC, compras y total, solo para el administrador.","e":"La pantalla Clientes tiene Descargar CSV con DNI, RUC, compras y total. Solo lo descarga el administrador porque son datos personales. La ruta clientes_csv la conecta Erick.","p":"Como administrador, Clientes → Descargar CSV funciona. Como cajero (70000002) el botón no aparece y la dirección da 403.","f":["controllers/ClienteController.php","views/clientes/lista.php"],"r":"feat/clientes-csv","own":"Keymer Machaca Puma"},
{"id":52,"col":0,"a":6,"t":"Manual de usuario · novedades","x":"Sección 7 del manual con las mejoras del equipo.","e":"Agrega al manual de usuario la sección 7 con todas las mejoras del equipo: qué cambió en cada pantalla y quién la usa. Se hace al final y se comprueba cada fila en el sistema.","p":"Con los demás PR mezclados, cada pantalla de la tabla funciona con el usuario indicado, como está escrito.","f":["docs/manual_usuario.md"],"r":"docs/manual-novedades","own":"Jhon Apaza Belizario"},
{"id":53,"col":0,"a":2,"t":"Reportes · ventas del periodo en PDF","x":"Descargar PDF con vendido, devuelto, neto, ventas por día, más vendidos y pagos.","e":"En Reportes, el botón Descargar PDF arma el resumen del periodo: vendido, devuelto, neto, ventas por día, más vendidos y métodos de pago. Reusa el FPDF del catálogo. La ruta reporte_pdf la conecta Erick.","p":"En Reportes, del 01/10 a hoy, Descargar PDF da una hoja con las 4 tablas. El catálogo en PDF sigue igual.","f":["controllers/ReporteController.php","views/reportes/ventas.php"],"r":"feat/reporte-ventas-pdf","own":"Suhaily Huaypar Quijhua"}

function card(t){
  const chips=[`<span class="lbl" style="--l:${AC[t.a]}">${esc(AREAS[t.a])}</span>`];
  if(t.pri)chips.push(`<span class="chip pri">Prioridad ${esc(t.pri)}</span>`);
  if(t.col===3)chips.push(`<span class="chip ok">Aprobó: Erick</span>`);
  if(t.v)chips.push(`<span class="chip ${t.al?'warn':t.col===3?'ok':''}">${esc(t.v)}</span>`);
  const prev=t.col>0?COLS[t.col-1]:'',next=t.col<3?COLS[t.col+1]:'';
  return `<article class="card${t.al?' al':''}" tabindex="0" role="button" data-abrir="${t.id}" aria-label="Ver explicación: ${esc(t.t)}">
  <div class="ar"><span class="st st${t.col}">${ICO[t.col]}</span>minimarket_mass #${t.id}</div>
  <div class="top"><h3>${esc(t.t)}</h3><span class="own${t.own?'':' none'}">${t.own?'<i class="av">'+esc(t.own[0])+'</i>':''}${esc(t.own?t.own.split(' ')[0]:'Sin asignar')}</span></div>
  <p class="ctx">${esc(t.x)}</p>
  ${t.r?`<div class="rama">${BR}<code>${esc(t.r)}</code></div>`:''}
  <dl><div><dt>Archivos</dt><dd>${(t.f||[]).map(a=>`<code>${esc(a)}</code>`).join(', ')}</dd></div>
  ${t.c?`<div><dt>Terminada cuando</dt><dd>${esc(t.c)}</dd></div>`:''}</dl>
  <div class="chips">${chips.join('')}</div>
  <span class="more">Toca para ver la explicación</span>
  <div class="move"><button type="button" data-mover="-1" data-id="${t.id}"${t.col===0?' disabled':''}>← ${esc(prev)}</button><button type="button" data-mover="1" data-id="${t.id}"${t.col===3?' disabled':''}>${esc(next)} →</button></div>
  </article>`;
}
function modal(t){
  return `<div class="veil" data-veil="1"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt">
  <div class="mh"><div class="r"><span class="eyebrow">${esc(COLS[t.col])} · ${esc(AREAS[t.a])}</span><button type="button" class="btn" id="cerrar" data-cerrar="1">Cerrar ✕</button></div><h2 id="mt">${esc(t.t)}</h2><div class="chips"><span class="chip ${t.col===3?'rev':'ok'}">${t.col===3?'Cerrada':'Abierta'}</span><span class="eyebrow">minimarket_mass #${t.id}</span></div></div>
  <div class="blk"><h3>¿De qué se trata?</h3><p>${esc(t.e||t.x)}</p></div>
  ${t.p?`<div class="blk test"><h3>¿Cómo sé que funciona?</h3><p>${esc(t.p)}</p></div>`:''}
  <dl class="det">
   <dt>Responsable</dt><dd><select id="resp" data-resp="${t.id}" aria-label="Responsable"><option value="">Sin asignar</option>${GRUPO.map(g=>`<option${t.own===g?' selected':''}>${esc(g)}</option>`).join('')}</select></dd>
   ${t.r?`<dt>Rama</dt><dd><code>${esc(t.r)}</code> (sugerida)</dd>`:''}
   <dt>Archivos</dt><dd>${(t.f||[]).map(a=>`<code>${esc(a)}</code>`).join(', ')||'—'}</dd>
   ${t.c?`<dt>Terminada cuando</dt><dd>${esc(t.c)}</dd>`:''}
   ${t.col===3?'<dt>Aprobó</dt><dd>Erick Silva Ayquipa</dd>':''}
   ${t.v?`<dt>Verificación</dt><dd>${esc(t.v)}</dd>`:''}
   ${t.pri?`<dt>Prioridad</dt><dd>${esc(t.pri)}</dd>`:''}
  </dl></div></div>`;
}
function form(){
  const b=borrador,v=k=>esc(b[k]||'');
  const opt=(arr,sel)=>arr.map((o,i)=>`<option value="${i}"${String(sel)===String(i)?' selected':''}>${esc(o)}</option>`).join('');
  return `<form class="form" id="nf" novalidate><h2>Nueva tarjeta</h2><div class="fields">
  <div class="fld w2"><label for="n-t">Tarea *</label><input id="n-t" name="t" maxlength="80" value="${v('t')}" placeholder="Ej.: Buscar producto por nombre"></div>
  <div class="fld"><label for="n-a">Área</label><select id="n-a" name="a">${opt(AREAS,b.a)}</select></div>
  <div class="fld"><label for="n-col">Columna</label><select id="n-col" name="col">${opt(COLS,b.col)}</select></div>
  <div class="fld all"><label for="n-x">De qué se trata</label><textarea id="n-x" name="x" maxlength="220" placeholder="Una o dos líneas">${v('x')}</textarea></div>
  <div class="fld all"><label for="n-e">Explicación sencilla (se ve al tocar la tarjeta)</label><textarea id="n-e" name="e" maxlength="500" placeholder="Como se lo contarías a un compañero que no programa">${v('e')}</textarea></div>
  <div class="fld w2"><label for="n-f">Archivos (separados por coma)</label><input id="n-f" name="f" maxlength="200" value="${v('f')}"></div>
  <div class="fld"><label for="n-r">Rama</label><input id="n-r" name="r" maxlength="60" value="${v('r')}" placeholder="feat/buscar-producto"></div>
  <div class="fld"><label for="n-c">Terminada cuando</label><input id="n-c" name="c" maxlength="120" value="${v('c')}"></div>
  </div>${errForm?`<div class="err" role="alert">${esc(errForm)}</div>`:''}
  <div class="row"><button type="submit" class="btn main">Agregar al tablero</button><button type="button" class="btn" data-cerrarform="1">Cancelar</button><span class="hint">* obligatorio</span></div></form>`;
}

  <div class="cta"><div class="ig"><input id="f-q" class="search" type="text" placeholder="Filtrar por palabra, archivo o responsable" aria-label="Filtrar tarjetas" value="${esc(qv)}"><button type="button" class="btn main" data-abrirform="1"${formAbierto?' hidden':''}>+ Agregar tarjeta</button></div><button type="button" class="btn gray" data-limpiar="1">Limpiar filtros</button></div>

  if(formAbierto)h+=form();
  h+='<div class="board">';

    const c=vis.filter(t=>t.col===i);
    h+=`<section class="col" data-c="${i}"><header><h2>${n}</h2><span class="count">${c.length}</span></header>`;

      if(i===3){const m=Math.ceil(c.length/2);h+=`<div class="lanes"><div class="lane">${c.slice(0,m).map(t=>card(t)).join('')}</div><div class="lane">${c.slice(m).map(t=>card(t)).join('')}</div></div>`}

  guardar();borrador={col:'0',a:'0'};errForm='';formAbierto=false;render();
}
document.addEventListener('click',ev=>{
  if(ev.target.dataset&&ev.target.dataset.veil){cerrar();return}
  const b=ev.target.closest('button');

  if(b.dataset.cerrarform){leerForm();formAbierto=false;errForm='';render();return}
});
document.addEventListener('change',ev=>{const s=ev.target;if(s.dataset&&s.dataset.resp){const id=Number(s.dataset.resp);st.own[id]=s.value;guardar();render()}});
document.addEventListener('keydown',ev=>{

});
document.addEventListener('input',ev=>{if(ev.target.id==='f-q'){qv=ev.target.value;const p=ev.target.selectionStart;render();const el=document.getElementById('f-q');if(el){el.focus();el.setSelectionRange(p,p)}}});

(function(){
  const cv=document.createElement('canvas');cv.setAttribute('aria-hidden','true');
  cv.style.cssText='position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60';
  document.body.appendChild(cv);
  const cx=cv.getContext('2d'),COL=['#2f81f7','#3fb950','#a371f7','#f778ba','#e3b341'],S=8,pts=[];
  let run=false,last='',lt=0;
  function fit(){const d=window.devicePixelRatio||1;cv.width=innerWidth*d;cv.height=innerHeight*d;cx.setTransform(d,0,0,d,0,0)}
  fit();addEventListener('resize',fit);
  function tick(now){
    cx.clearRect(0,0,innerWidth,innerHeight);
    for(let i=pts.length-1;i>=0;i--){const p=pts[i],a=1-(now-p.t)/p.d;if(a<=0){pts.splice(i,1);continue}cx.globalAlpha=a*a*.4;cx.fillStyle=p.c;cx.fillRect(p.x,p.y,S,S)}
    cx.globalAlpha=1;
    if(pts.length)requestAnimationFrame(tick);else run=false;
  }
  function add(x,y){
    pts.push({x,y,c:COL[Math.random()*COL.length|0],t:performance.now(),d:450+Math.random()*450});
    if(pts.length>60)pts.shift();
    if(!run){run=true;requestAnimationFrame(tick)}
  }
  window.mirar=function(){if(window.__m3d)window.__m3d.mount()};
  addEventListener('pointermove',e=>{
    window.__mx=e.clientX;window.__my=e.clientY;mirar();
    if(!window.__rastro)return;
    const now=performance.now();if(now-lt<70)return;
    const x=Math.floor(e.clientX/S)*S,y=Math.floor(e.clientY/S)*S,k=x+','+y;
    if(k===last)return;last=k;lt=now;
    add(x,y);
    if(Math.random()<.12)add(x+(Math.random()<.5?-S:S),y+(Math.random()<.5?-S:S));
  },{passive:true});
})();
</script>
