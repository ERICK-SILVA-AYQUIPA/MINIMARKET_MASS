# Revision automatica en cada push y pull request. Tres trabajos que corren a la vez:
# - pruebas: sintaxis de todos los .php, pruebas unitarias, revision de seguridad del codigo, pruebas web por rol,
#   pruebas de integracion, API de la app Android (contra MySQL en Docker) y, al final, la prueba de restauracion
#   (respaldo -> se borra todo -> restaurar -> verificar_instalacion.php), con Docker y sin Docker.
# - analisis: PHPStan nivel 5 (solo falla con errores nuevos: los que ya habia estan en phpstan-baseline.neon)
#   y que los scripts .ps1 y .sh se puedan leer.
# - android: pruebas de la app (CarritoTest, CodigoLeidoTest...) y el APK de prueba, que queda para descargar.
# - e2e: Playwright sobre la pagina (login, apertura, venta, movimientos, arqueo y cierre) con regresion visual
#   pixel a pixel. Corre dentro de la imagen de Docker de Playwright, la misma con la que se generan las capturas base.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, gd
          coverage: none

      - name: Sintaxis de PHP
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Pruebas unitarias (sin base)
        run: php backend/tests/unitarios.php

      - name: Revision de seguridad del codigo (CSRF, escapado, SQL)
        run: php backend/tests/seguridad.php

      # Las claves de .env.example son de ejemplo: solo existen dentro del runner y se borran al terminar
      - name: Levantar MySQL 8.4.11
        run: |
          cp .env.example .env
          docker compose up -d --wait
          sleep 5

      # No cambian datos: van antes de las de integracion, que piden la base recien creada
      - name: Pruebas web (cada rol, CSRF, 403 y 422)
        run: php backend/tests/web.php

      - name: Pruebas de integracion
        run: php backend/tests/integracion.php

      # Despues de integracion: esa prueba pide la base recien creada y esta registra ventas e ingresos
      - name: Pruebas de la API de la app Android
        run: php backend/tests/api.php

      # Al final: borra la base del contenedor (docker compose down -v) y la devuelve desde el respaldo
      - name: Prueba de restauracion (respaldo, se borra todo, restaurar, verificar)
        run: bash backend/tests/restauracion.sh

      # Lo mismo sin docker exec: los scripts usan el mysqldump y el mysql del runner, como en Laragon
      # o en un servidor con MySQL instalado (RESPALDO_MODO=local). La base sigue en el contenedor, por el puerto 3307.
      - name: Prueba de restauracion sin Docker (RESPALDO_MODO=local)
        env:
          RESPALDO_MODO: local
          RESPALDO_DB_USER: root
          RESPALDO_DB_PASSWORD: cambia_esta_clave_root
          RESPALDO_DB_HOST: 127.0.0.1
          RESPALDO_DB_PORT: '3307'
        run: |
          command -v mysqldump > /dev/null || { sudo apt-get update -q && sudo apt-get install -y -q mysql-client; }
          bash backend/tests/restauracion.sh

      - name: Log de MySQL si algo fallo
        if: failure()
        run: docker compose logs mysql | tail -n 80

  analisis:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PHPSTAN_VERSION: 2.1.31
      PHPSTAN_SHA256: f9b7ebabd110dcf628c8f62f7a974b07b54cb0bb62cf9142d8db17dbc6cd39fc
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, gd
          coverage: none

      # Sin Composer: se baja el .phar de la version fija y se comprueba que sea ese archivo
      - name: PHPStan nivel 5
        run: |
          curl -sSfL -o phpstan.phar "https://github.com/phpstan/phpstan/releases/download/${PHPSTAN_VERSION}/phpstan.phar"
          echo "${PHPSTAN_SHA256}  phpstan.phar" | sha256sum -c -
          php phpstan.phar analyse --memory-limit=1G --no-progress --error-format=github

      - name: Sintaxis de los scripts .sh
        run: find . -name '*.sh' -not -path './android-app/*' -print0 | xargs -0 -n1 bash -n

      - name: Sintaxis de los scripts .ps1
        shell: pwsh
        run: |
          $malos = 0
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $errores = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errores) | Out-Null
            foreach ($e in $errores) { Write-Host "::error file=$($_.FullName),line=$($e.Extent.StartLineNumber)::$($e.Message)"; $malos++ }
          }
          if ($malos -gt 0) { exit 1 }

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Base recien creada: las pruebas abren un turno, venden y cierran la caja de verdad
      - name: Levantar MySQL 8.4.11
        run: |
          cp .env.example .env
          docker compose up -d --wait mysql
          sleep 5

      # Mismo script que en las PCs del equipo: misma imagen, mismas letras, mismos pixeles
      - name: Pruebas E2E y capturas (Playwright en Docker)
        run: bash tests/e2e/correr_en_docker.sh --update-snapshots

      - name: TEMPORAL subir las capturas nuevas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-nuevas
          path: tests/e2e/
          retention-days: 1

      # Si una captura no coincide, el informe muestra la esperada, la nueva y la diferencia
      - name: Subir el informe de Playwright si algo fallo
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: informe-e2e
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Guarda las librerias de Gradle entre corridas (la segunda vez tarda mucho menos)
      - uses: gradle/actions/setup-gradle@v4

      # El SDK de Android ya viene instalado en ubuntu-24.04 (ANDROID_HOME)
      - name: Pruebas de la app y APK de prueba
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - name: Subir el APK de prueba
        uses: actions/upload-artifact@v4
        with:
          name: minimarket-mass-debug-apk
          path: android-app/app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error

      - name: Subir el informe de pruebas si algo fallo
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: informe-pruebas-android
          path: android-app/app/build/reports/tests/
          retention-days: 7
