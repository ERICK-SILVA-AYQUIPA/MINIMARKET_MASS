# Revision automatica en cada push y pull request:
# 1) sintaxis de todos los .php, 2) pruebas unitarias, 3) revision de seguridad del codigo,
# 4) pruebas web por rol y 5) pruebas de integracion, las dos contra MySQL en Docker.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, gd
          coverage: none

      - name: Sintaxis de PHP
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Pruebas unitarias (sin base)
        run: php tests/unitarios.php

      - name: Revision de seguridad del codigo (CSRF, escapado, SQL)
        run: php tests/seguridad.php

      # Las claves de .env.example son de ejemplo: solo existen dentro del runner y se borran al terminar
      - name: Levantar MySQL 8.4.11
        run: |
          cp .env.example .env
          docker compose up -d --wait
          sleep 5

      # No cambian datos: van antes de las de integracion, que piden la base recien creada
      - name: Pruebas web (cada rol, CSRF, 403 y 422)
        run: php tests/web.php

      - name: Pruebas de integracion
        run: php tests/integracion.php

      - name: Log de MySQL si algo fallo
        if: failure()
        run: docker compose logs mysql | tail -n 80
